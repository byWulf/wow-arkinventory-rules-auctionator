name: Release

# Push a tag like v1.2.3 to build the addon zip and upload it to CurseForge and GitHub releases.
# Run the workflow manually ("Run workflow") to only build the zip as an artifact, without uploading.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Package and release
        if: startsWith(github.ref, 'refs/tags/')
        uses: BigWigsMods/packager@v2

      - name: Package only (no upload)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: BigWigsMods/packager@v2
        with:
          args: -d -z

      - name: Upload test build
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: package
          path: .release/
